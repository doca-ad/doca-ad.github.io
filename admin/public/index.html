<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>DOCA — Content</title>
<style>
  :root {
    --bg:#fff; --ink:#282c34; --muted:#6b7280; --faint:#aab0bb;
    --line:#e7e9ee; --soft:#f6f7f9; --danger:#a3312b;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 "Archivo Narrow","Arial Narrow",system-ui,sans-serif }
  header { position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); padding:14px 24px; display:flex;
           align-items:center; gap:16px; z-index:10 }
  header h1 { font-size:17px; font-weight:500; margin:0; letter-spacing:.02em }
  header .who { margin-left:auto; color:var(--muted); font-size:13px }
  main { max-width:1100px; margin:0 auto; padding:28px 24px 96px }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:18px }
  .bar h2 { font-size:15px; font-weight:500; margin:0; color:var(--muted) }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink);
           padding:7px 14px; cursor:pointer; transition:background .15s, border-color .15s }
  button:hover { background:var(--soft) }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink) }
  button.primary:hover { opacity:.88 }
  button.danger { color:var(--danger); border-color:#e9d5d3 }
  button:disabled { opacity:.5; cursor:not-allowed }
  table { width:100%; border-collapse:collapse }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:12.5px;
       text-transform:uppercase; letter-spacing:.06em; padding:0 10px 10px; border-bottom:1px solid var(--line) }
  td { padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle }
  tr.index-only td { color:var(--faint) }
  tr.index-only td.title { font-weight:400 }
  td.title { font-weight:500 }
  .row-actions { text-align:right; white-space:nowrap }
  dialog { border:none; padding:0; width:min(760px,94vw); box-shadow:0 20px 60px rgba(0,0,0,.18) }
  dialog::backdrop { background:rgba(0,0,0,.35) }
  form.editor { padding:26px }
  form.editor h3 { margin:0 0 20px; font-size:16px; font-weight:500 }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px }
  label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;
          text-transform:uppercase; letter-spacing:.05em }
  input, select, textarea { width:100%; font:inherit; padding:8px 10px;
          border:1px solid var(--line); background:#fff; color:var(--ink) }
  textarea { min-height:120px; resize:vertical; line-height:1.55 }
  .full { grid-column:1 / -1 }
  .actions { display:flex; gap:10px; margin-top:22px; align-items:center }
  .actions .spacer { margin-left:auto }
  .note { background:var(--soft); border-left:2px solid var(--faint); padding:10px 14px;
          color:var(--muted); font-size:13.5px; margin:0 0 18px }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px;
           background:var(--ink); color:#fff; padding:10px 18px; font-size:14px;
           opacity:0; pointer-events:none; transition:opacity .2s }
  .toast.show { opacity:1 }
  .empty { color:var(--muted); padding:40px 0; text-align:center }
</style>
</head>
<body>
<header>
  <h1>DOCA — Content</h1>
  <span class="who" id="who">…</span>
</header>

<main>
  <p class="note" id="note">
    Changes publish automatically: saving rebuilds the site, which takes a minute or two.
  </p>

  <div class="bar">
    <h2 id="count">Projects</h2>
    <button class="primary" style="margin-left:auto" id="new">Add project</button>
  </div>

  <table>
    <thead>
      <tr><th>Title</th><th>Type</th><th>Status</th><th>Location</th><th>Year</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No projects yet.</div>
</main>

<dialog id="dlg">
  <form class="editor" method="dialog">
    <h3 id="dlgTitle">Edit project</h3>
    <div class="grid">
      <div><label for="f-title">Title</label><input id="f-title" required /></div>
      <div><label for="f-status">Status</label>
        <select id="f-status">
          <option value="completed">Completed / Finalizat</option>
          <option value="in_progress">In progress / În curs</option>
          <option value="feasibility_study">Feasibility study / Studiu de fezabilitate</option>
          <option value="competition">Competition entry / Concurs</option>
          <option value="unbuilt">Unbuilt / Neconstruit</option>
          <option value="study">Study / Studiu</option>
        </select>
      </div>
      <div><label for="f-type">Type</label><input id="f-type" placeholder="Architecture / Residential" required /></div>
      <div><label for="f-location">Location</label><input id="f-location" placeholder="Bucharest, Romania" /></div>
      <div><label for="f-year">Year</label><input id="f-year" placeholder="2026" /></div>
      <div><label for="f-home">Featured on home</label>
        <select id="f-home"><option value="0">No</option><option value="1">Yes</option></select>
      </div>
      <div class="full"><label for="f-en">Description — English</label><textarea id="f-en"></textarea></div>
      <div class="full"><label for="f-ro">Description — Română</label><textarea id="f-ro"></textarea></div>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="del">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="button" class="primary" id="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const STATUS = {
  completed:"Completed", in_progress:"In progress", feasibility_study:"Feasibility study",
  competition:"Competition entry", unbuilt:"Unbuilt", study:"Study",
};
const INDEX_ONLY = ["in_progress","feasibility_study"];
let projects = [], editing = null;

const toast = (msg) => {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
};

async function api(path, opts) {
  const res = await fetch(path, { credentials:"same-origin", ...opts });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `HTTP ${res.status}`);
  return res.json();
}

function render() {
  const tbody = $("#rows"); tbody.innerHTML = "";
  $("#count").textContent = `${projects.length} projects`;
  $("#empty").hidden = projects.length > 0;
  for (const p of projects) {
    const tr = document.createElement("tr");
    if (INDEX_ONLY.includes(p.status)) tr.className = "index-only";
    tr.innerHTML = `
      <td class="title"></td><td></td><td></td><td></td><td></td>
      <td class="row-actions"><button data-id="${p.id}">Edit</button></td>`;
    const td = tr.querySelectorAll("td");
    td[0].textContent = p.title;
    td[1].textContent = p.type;
    td[2].textContent = STATUS[p.status] ?? p.status;
    td[3].textContent = p.location;
    td[4].textContent = p.year;
    tr.querySelector("button").onclick = () => open(p);
    tbody.appendChild(tr);
  }
}

function open(p) {
  editing = p;
  $("#dlgTitle").textContent = p ? "Edit project" : "New project";
  $("#del").hidden = !p;
  $("#f-title").value = p?.title ?? "";
  $("#f-status").value = p?.status ?? "completed";
  $("#f-type").value = p?.type ?? "";
  $("#f-location").value = p?.location ?? "";
  $("#f-year").value = p?.year ?? String(new Date().getFullYear());
  $("#f-home").value = p?.home ? "1" : "0";
  $("#f-en").value = p?.description_en ?? "";
  $("#f-ro").value = p?.description_ro ?? "";
  $("#dlg").showModal();
}

const slugify = (title, type) =>
  `${title.toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}` +
  `-${type.split("/")[0].trim().toLowerCase().replace(/\s+/g,"-")}`;

$("#new").onclick = () => open(null);
$("#cancel").onclick = () => $("#dlg").close();

$("#save").onclick = async () => {
  const body = {
    title: $("#f-title").value.trim(),
    status: $("#f-status").value,
    type: $("#f-type").value.trim(),
    location: $("#f-location").value.trim(),
    year: $("#f-year").value.trim(),
    home: $("#f-home").value === "1",
    description_en: $("#f-en").value,
    description_ro: $("#f-ro").value,
  };
  if (!body.title || !body.type) return toast("Title and type are required");
  body.slug = slugify(body.title, body.type);
  try {
    if (editing) {
      await api(`/api/projects/${editing.id}`, {
        method:"PUT", headers:{"content-type":"application/json"}, body:JSON.stringify(body),
      });
    } else {
      body.id = `project-${Date.now()}`;
      await api("/api/projects", {
        method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body),
      });
    }
    $("#dlg").close();
    await load();
    toast("Saved — the site is rebuilding");
  } catch (e) { toast(e.message); }
};

$("#del").onclick = async () => {
  if (!editing) return;
  if (!confirm(`Delete “${editing.title}”? This cannot be undone.`)) return;
  try {
    await api(`/api/projects/${editing.id}`, { method:"DELETE" });
    $("#dlg").close();
    await load();
    toast("Deleted — the site is rebuilding");
  } catch (e) { toast(e.message); }
};

async function load() {
  const data = await api("/api/content");
  projects = data.projects;
  render();
}

(async () => {
  try {
    const me = await api("/api/me");
    $("#who").textContent = me.email;
  } catch {
    $("#who").textContent = "not signed in";
  }
  try { await load(); } catch (e) { toast(e.message); }
})();
</script>
</body>
</html>
